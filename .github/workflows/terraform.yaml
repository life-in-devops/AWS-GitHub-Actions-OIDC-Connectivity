name: Terraform

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # Get and decode GitHub OIDC claims
      - name: Inspect OIDC claims
        shell: bash
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          echo "OIDC token received."

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)

          # Add padding if required
          PADDING=$((4 - ${#PAYLOAD} % 4))
          if [ "$PADDING" -ne 4 ]; then
            PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $PADDING))"
          fi

          echo "OIDC Claims:"
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{
            iss,
            sub,
            aud,
            repository,
            repository_id,
            repository_owner,
            repository_owner_id,
            ref,
            ref_type,
            workflow,
            environment
          }'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::539188695824:role/GitHubActionsTerraformRole
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="bucket_name=my-unique-terraform-demo-bucket-12345" \
            -var="environment=dev"

      - name: Terraform Apply
        run: |
          terraform apply \
            -var="bucket_name=my-unique-terraform-demo-bucket-12345" \
            -var="environment=dev" \
            -auto-approve